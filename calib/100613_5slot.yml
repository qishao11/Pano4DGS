# NOTE on the pairing convention (verified 2026-08-10, see paper_experiment_list.md
# "槽位约定核实"): slot 1 is DROID's stereo-right placeholder and is dropped by
# motion_filter (`del indices[1]`), so N image dirs give N-1 *mapping* cameras and
# T_cami_cam0[i] pairs with mapping camera i, NOT with slot i. With the 5 dirs
# [front, front, front_right, front_left, front_right] the mapping cameras are
# [front, front_right, front_left, front_right], so the rows below must be
# [identity, T_front_right, T_front_left, T_front_right].
# The previous version had identity in row 1, which placed front_right at exactly
# front's pose -- that would have invalidated this control experiment regardless of
# the resource-contention kill documented in panoramic_4dgs_status.md section 3.3.
T_cami_cam0:  [[0, 0, 0, 0, 0, 0, 1],
               [-1.000482, 0, -0.462101, 0, -0.385045, 0, 0.922846],
