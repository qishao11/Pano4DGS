camera:      'equirect'

# All six cubemap faces, including the poles. The four-face calib
# (equirect_test.yml) covers only 46.5% of the sphere in ERP pixels -- the top
# and bottom of every panorama come out black. Adding up/down brings that to
# 99.9%, and the projection round-trip error actually drops (2.133 -> 1.484 on
# the synthetic room), because the polar region no longer has to be extrapolated
# from the horizontal faces' edges.
#
# Cost: 6 mapping cameras instead of 4, so ~50% more compute and memory.
faces:       ['front', 'right', 'back', 'left', 'up', 'down']

face_size:   384
fov:         90

baseline:    [0, 0, 0, 0, 0, 0, 1]

timescale:   1
